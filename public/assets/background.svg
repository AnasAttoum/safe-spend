<svg
  width="900"
  height="700"
  viewBox="0 0 900 700"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <radialGradient id="blueGlow"
      cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1050 170) rotate(120) scale(2000 1000)">
      <stop offset="0" stop-color="#1677FF" stop-opacity=".20"/>
      <stop offset=".45" stop-color="#0B4DA8" stop-opacity=".0"/>
      <stop offset="1" stop-color="#06152A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bottomWave"
      x1="200" y1="620"
      x2="800" y2="500"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071A35" stop-opacity="0"/>
      <stop offset=".55" stop-color="#0B3970" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1264C4" stop-opacity=".12"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

  </defs>

  <!-- Main blue atmospheric glow -->
  <rect
    width="900"
    height="700"
    fill="url(#blueGlow)"
  />

  <!-- Soft blurred light -->
  <ellipse
    cx="660"
    cy="180"
    rx="190"
    ry="130"
    fill="#1677FF"
    opacity=".08"
    filter="url(#blur)"
  />

  <!-- Bottom abstract shadow / wave -->
  <path
    d="
      M900 450
      C820 475 790 535 700 570
      C620 602 520 610 455 665
      C430 685 415 700 400 700
      L900 700
      Z
    "
    fill="url(#bottomWave)"
  />

  <!-- Secondary soft wave -->
  <path
    d="
      M900 510
      C820 545 770 600 690 630
      C600 664 550 670 505 700
      L900 700
      Z
    "
    fill="#0A2A50"
    opacity=".28"
  />

</svg>